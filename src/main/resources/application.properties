spring.application.name=blu-visual-teacher
server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
blu.ollama-url=${OLLAMA_URL:http://localhost:11434}
blu.ollama-model=${OLLAMA_MODEL:qwen2.5:3b}
blu.output-dir=${BLU_OUTPUT_DIR:./generated}
blu.espeak-command=${ESPEAK_COMMAND:espeak-ng}
blu.ffmpeg-command=${FFMPEG_COMMAND:ffmpeg}
blu.ffprobe-command=${FFPROBE_COMMAND:ffprobe}

# Optional offline neural English narration. If the model assets are absent or synthesis fails, eSpeak NG is used.
blu.kokoro-command=${KOKORO_COMMAND:python3}
blu.kokoro-script=${KOKORO_SCRIPT:./tts/kokoro_synthesize.py}
blu.kokoro-model=${KOKORO_MODEL:./tts/models/kokoro-v1.0.onnx}
blu.kokoro-voices=${KOKORO_VOICES:./tts/models/voices-v1.0.bin}
blu.kokoro-voice-en=${KOKORO_VOICE_EN:af_heart}
blu.kokoro-speed=${KOKORO_SPEED:1.0}
